<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Xeno-HR — Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #475569; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        background: #0f172a;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #1e293b; }
      .hi { margin-top: 16px; font-size: 13px; color: #64748b; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/favicon.svg" alt="Xeno-HR" />
      <h1>You're offline</h1>
      <p>Xeno-HR can't reach the server right now. Check your internet connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hi">आप ऑफ़लाइन हैं। कृपया इंटरनेट कनेक्शन जाँचें।</p>
    </main>
    <script>
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
